# The live tests (design §10): grpc-go's interop server at v1.67.1 and
# tools/test-server, over h2c and TLS, on all three platforms; and Spark
# Connect 4.2.1 in Docker, on Ubuntu, the one runner with Docker. Separate from
# R-CMD-check.yaml, whose checks must never touch a network, and which has
# no step to start a server before the check (decided in Stage 4).

on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  pull_request:
  workflow_dispatch:

name: live

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ${{ matrix.os }}
    name: live (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      # A current toolchain, not tools/go.mod's minimum: macOS's dyld refuses
      # binaries without LC_UUID, which Go 1.22's linker does not write.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: tools/go.sum

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr

      - name: Install
        run: R CMD INSTALL .

      - name: Start the servers and run the tests
        run: tools/ci-live.sh "$RUNNER_TEMP/zugrpc-live"

  spark:
    runs-on: ubuntu-latest
    name: spark connect (ubuntu-latest)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # In the foreground of its container (SPARK_NO_DAEMONIZE), listening
      # on every interface so that the published port reaches it.
      - name: Start Spark Connect 4.2.1
        run: |
          docker run -d --name spark -p 15002:15002 \
            -e SPARK_NO_DAEMONIZE=true \
            apache/spark:4.2.1 \
            /opt/spark/sbin/start-connect-server.sh \
            --conf spark.connect.grpc.binding.address=0.0.0.0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr

      - name: Install
        run: R CMD INSTALL .

      - name: Wait for Spark Connect
        timeout-minutes: 5
        run: |
          for i in $(seq 1 120); do
            if docker logs spark 2>&1 | grep -qi "Spark Connect server started"; then
              break
            fi
            sleep 2
          done
          docker logs spark 2>&1 | tail -20
          docker logs spark 2>&1 | grep -qi "Spark Connect server started"

      - name: Run the Spark tests
        env:
          ZU_SPARK_TEST_SERVER: http://127.0.0.1:15002
          NOT_CRAN: "true"
        run: Rscript tools/ci-spark-tests.R

      - name: Spark's log
        if: failure()
        run: docker logs spark 2>&1 | tail -200
