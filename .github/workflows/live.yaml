# The live tests (design §10): grpc-go's interop server at v1.67.1 and
# tools/test-server, over h2c and TLS, on all three platforms. Separate from
# R-CMD-check.yaml, whose checks must never touch a network, and which has
# no step to start a server before the check (decided in Stage 4).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: live

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ${{ matrix.os }}
    name: live (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      # A current toolchain, not tools/go.mod's minimum: macOS's dyld refuses
      # binaries without LC_UUID, which Go 1.22's linker does not write.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: tools/go.sum

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr

      - name: Install
        run: R CMD INSTALL .

      - name: Start the servers and run the tests
        run: tools/ci-live.sh "$RUNNER_TEMP/zugrpc-live"
